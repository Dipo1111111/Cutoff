<!DOCTYPE html>
<html lang="en">
<head>

<title>Cutoff — notes</title>
<link rel="stylesheet" href="styles.css">
</head>

  <aside class="side">

    <nav class="nav" aria-label="Board sections">
      <a href="#week" data-screen="week">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/><circle cx="12" cy="15" r="2.2" fill="currentColor" stroke="none"/></svg>
        <span>Week</span></a>
      <a href="#plan" data-screen="plan">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2.5"/><path d="M3.5 9.4h17M3.5 14.6h17M9.4 9.4V20M15 9.4V20"/></svg>
        <span>Plan</span></a>
      <a href="#progress" data-screen="progress">

      <a href="#settings" data-screen="settings">

        <span>Settings</span></a>
    </nav>

    <div class="side-foot">
      <span class="lab">Exam</span>
      <span class="num">15 Mar 2027</span>
    </div>
  </aside>

  <main class="main" id="view" tabindex="-1"></main>

  <aside class="rail" id="rail"></aside>

</div>
<script src="plan.js"></script>
<script src="app.js"></script>
<script src="words/data.js"></script>
<script src="words/words.js"></script>
